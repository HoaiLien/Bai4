<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>New Product</title>
    <link rel="stylesheet" href="product.css">
</head>

<body>

    <h1>New Product</h1>
    <hr>

    <div class="form-row">
        <div class="form-group">
            <label>Product Name</label>
            <input type="text" value="Quần âu">
        </div>
        <div class="form-group">
            <label>Quantity</label>
            <input type="text" value="20">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Unit Price</label>
            <input type="text" value="400000">
        </div>
        <div class="form-group">
            <label>Discount</label>
            <input type="text" value="10">
        </div>
    </div>

    <div class="btn-group">
        <button type="button">Sell</button>
        <button type="button">Cancel</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Product Name</th>
                <th>Quantity</th>
                <th>Unit Price</th>
                <th>Discount</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Áo thun</td>
                <td>12</td>
                <td>$30000</td>
                <td>10</td>
                <td>$324000</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Quần âu</td>
                <td>20</td>
                <td>$400000</td>
                <td>10</td>
                <td>$7200000</td>
            </tr>
        </tbody>
    </table>

</body>

</html>
