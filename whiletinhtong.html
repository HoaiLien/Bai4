<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let tong = 0;
        let i = 0;
        while (i < 6) {
            document.write(i + '<br>');
            tong += i;
            i++;
        }
        document.write("Tổng cuối cùng: " + tong + '<br>');
        console.log("Tổng cuối cùng: " + tong);
        document.getElementById("demo").innerHTML = "Tổng cuối cùng: " + tong;
    </script>
</body>

</body>

</html>
